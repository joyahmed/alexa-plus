<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Hot tub: lift the grey cover, press POWER then JETS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff1ff"/><stop offset="1" stop-color="#fbf5ea"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdcff"/><stop offset="1" stop-color="#2fa3d8"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#b9c9d6" opacity=".7"><polygon points="0,230 120,130 220,200 330,100 460,190 560,140 640,210 640,360 0,360"/></g>
  <rect x="0" y="300" width="640" height="60" fill="#e6dccb"/>
  <rect x="60" y="250" width="520" height="70" rx="10" fill="#8b6a4e"/>
  <rect x="80" y="228" width="480" height="36" rx="18" fill="url(#water)"/>
  <g fill="#ffffff" opacity=".9"><circle cx="160" cy="240" r="4"/><circle cx="240" cy="236" r="3"/><circle cx="330" cy="242" r="5"/><circle cx="420" cy="238" r="3"/><circle cx="490" cy="241" r="4"/></g>
  <rect x="470" y="196" width="120" height="40" rx="6" fill="#8e949c"/><text x="530" y="221" text-anchor="middle" font-family="Manrope, Inter, system-ui" font-size="14" font-weight="600" fill="#ffffff">grey cover</text>
  <rect x="24" y="176" width="190" height="60" rx="8" fill="#ffffff" stroke="#3b6cff" stroke-width="2"/>
  <circle cx="46" cy="206" r="9" fill="#3b6cff"/><text x="62" y="211" font-family="Manrope, Inter, system-ui" font-size="13" font-weight="700" fill="#1a1c22">1 POWER</text>
  <circle cx="136" cy="206" r="9" fill="#3b6cff"/><text x="152" y="211" font-family="Manrope, Inter, system-ui" font-size="13" font-weight="700" fill="#1a1c22">2 JETS</text>
  <text x="24" y="42" font-family="Manrope, Inter, system-ui" font-size="24" font-weight="800" fill="#1a1c22">Hot tub</text>
  <text x="24" y="68" font-family="Manrope, Inter, system-ui" font-size="14" font-weight="500" fill="#5b6070">Lift the cover onto the rail · POWER, then JETS · ~15 min to warm</text>
</svg>
