name: 🚀 Deploy alexa-plus

on:
  push:
    branches: [main]
    # Prose-only commits do not need a rebuild; workflow_dispatch is the escape hatch.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: zetta-server-deploy
  cancel-in-progress: false

# The rebuilt Zetta server deploys itself: ci-deploy fast-forwards the checkout to origin/main,
# installs, builds, restarts the service(s), health-checks and rolls back on failure.
# Migrations and seeds are NOT run here (the deploy user cannot read the database password).
# One checkout holds both apps (alexa-plus and alexa-plus-sim), so one call deploys both.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the Zetta server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "deploy@$DEPLOY_HOST" alexa-plus
